name = "rayyan-enterprises"
compatibility_date = "2024-01-01"

# Pages Functions Configuration
pages_build_output_dir = "."

# KV Namespace Binding for Pages Functions
[[kv_namespaces]]
binding = "ADMIN_CREDENTIALS"
id = "your_kv_namespace_id"  # Replace with your actual KV namespace ID
preview_id = "your_preview_kv_namespace_id"  # Optional: for preview environments